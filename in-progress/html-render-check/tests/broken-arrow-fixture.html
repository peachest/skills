<!DOCTYPE html>
<html lang="zh">
<head><meta charset="utf-8"><title>broken-arrow fixture</title>
<style>body{font-family:sans-serif;margin:2rem}svg{border:1px solid #ccc;margin-bottom:1rem}</style>
</head>
<body>
<h2>Clean: 应零 broken-arrow 发现</h2>
<svg id="clean" width="420" height="140" viewBox="0 0 420 140">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect x="20" y="40" width="100" height="60" rx="6" fill="#dbeafe" stroke="#333"/>
  <text x="70" y="75" text-anchor="middle" font-size="14">主干</text>
  <rect x="300" y="40" width="100" height="60" rx="6" fill="#dcfce7" stroke="#333"/>
  <text x="350" y="75" text-anchor="middle" font-size="14">投影</text>
  <line x1="120" y1="70" x2="298" y2="70" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <circle cx="220" cy="115" r="14" fill="#fef3c7" stroke="#333"/>
</svg>

<h2>Broken: 悬空箭头（marker 端点离所有节点 &gt;6px）+ 穿框边（穿过无关大节点）</h2>
<svg id="broken" width="420" height="200" viewBox="0 0 420 200">
  <rect x="20" y="20" width="100" height="50" rx="6" fill="#dbeafe" stroke="#333"/>
  <text x="70" y="50" text-anchor="middle" font-size="14">A</text>
  <rect x="20" y="130" width="100" height="50" rx="6" fill="#dbeafe" stroke="#333"/>
  <text x="70" y="160" text-anchor="middle" font-size="14">B</text>
  <rect x="180" y="125" width="120" height="60" rx="6" fill="#fee2e2" stroke="#333"/>
  <text x="240" y="160" text-anchor="middle" font-size="14">无关大节点</text>
  <rect x="340" y="130" width="60" height="50" rx="6" fill="#dcfce7" stroke="#333"/>
  <text x="370" y="160" text-anchor="middle" font-size="14">C</text>
  <!-- dangling: endpoint (310,45) far from every node -->
  <line x1="120" y1="45" x2="310" y2="45" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <!-- through-box: B->C straight line passes through 无关大节点 -->
  <line x1="120" y1="155" x2="338" y2="155" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
</svg>
</body></html>
