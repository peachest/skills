[project]
name = "mr-review-triage-tests"
version = "0.1.0"
description = "CLI-level tests for the mr-review-triage skill scripts (offline API fixtures, no network)."
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pyright]
include = ["scripts", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
