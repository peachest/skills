name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Run tests
        run: |
          cd engineering/mr-review-triage
          uv run pytest tests -q
          cd ../../in-progress/teach
          uv run pytest -q
