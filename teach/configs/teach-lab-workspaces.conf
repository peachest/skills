# teach-lab workspace config — used by scan-and-split-notes.sh
#
# Format: <workspace-name>:<source-dir>:<keyword-regex>
#   - If keyword-regex is empty, all notes from source-dir go to this workspace
#   - If multiple workspaces share the same source-dir, notes are classified
#     by filename matching against keyword-regex (first match wins)
#   - Lines starting with # are comments
#
# Token budget per workspace: ~80-120K (fits in one subagent context)

# Batch 1: Go (231 notes → 4 workspaces)
go-core:~/obsidianNote/go:^(?!.*(controller|informer|reflector|reconcile|webhook|finalizer|crd|kueue|client-go|controller-runtime|test|ginkgo|gomega|mock|envtest|cli|cobra|gin|grpc|protobuf|json|template|pprof|设计模式|模式))
go-eng:~/obsidianNote/go:(test|ginkgo|gomega|mock|envtest|基准|模糊|module|go.mod|项目依赖|工具依赖|releasenote|现代化|代码质量|最佳实践|完备性|稳定性|灰度|集成|并发|goroutine|sync|atomic|mutex|cond|cas|pool|channel|parallel|race|锁|线程|协程|wait|signal|context|clock)
go-tools:~/obsidianNote/go:(cli|cobra|gin|grpc|protobuf|buf|json|template|pprof|lazygit|gocui|chromedp|cue|builder|command|option|predicate|trait|middleware|adapter|eventbus|代理|设计模式|模式|cache|Cache|缓存|内存分配|垃圾回收|堆栈|逃逸|高性能|高效|Hash|Swiss|Tables)
go-k8s:~/obsidianNote/go:(controller|informer|reflector|reconcile|webhook|finalizer|crd|kueue|client-go|controller-runtime|sharedIndex|eventHandler|FieldSelector|NamespacedName|Manager|Runnable|orchestrator|cluster|healthCheck|k8s|探针|prometheus|grafana|loki|opentelemetry|日志|pprof|node-exporter|kube|alertmanager|metrics|monitor)

# Batch 2: K8s (58 notes → 2 workspaces)
k8s-scheduling:~/obsidianNote/k8s:(调度|scheduler|拓扑|资源分配|QoS|Pod 开销|HPA|设备插件|DRA|dra|ascend|cgroup)
k8s-ops:~/obsidianNote/k8s:

# Batch 2: KVCache (35 notes → 2 workspaces)
KVCache-quant:~/ai/KVCache:(quant|kivi|kvquant|calibquant|commvq|polarquant|rabbitquant|turboquant|product quant|变换编码|量化|snap|qjl)
